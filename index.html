<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackKart - South Indian Snacks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaeded;
        }

        .navbar {
            background: #131921;
            color: white;
            display: flex;
            align-items: center;
            padding: 15px 20px;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff9900;
        }

        .search-box {
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }

        .cart-btn {
            background: #febd69;
            color: black;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(90deg, #fff3cd, #ffe8cc);
            padding: 40px;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            color: #222;
        }

        .hero p {
            margin-top: 10px;
            font-size: 18px;
            color: #555;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .card h3 {
            margin: 12px 0;
            color: #222;
        }

        .price {
            color: #b12704;
            font-size: 22px;
            font-weight: bold;
        }

        .card button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 20px;
            background: #ffd814;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .card button:hover {
            background: #f7ca00;
        }

        #cartPanel {
            position: fixed;
            right: 0;
            top: 0;
            width: 380px;
            height: 100%;
            background: white;
            box-shadow: -3px 0 15px rgba(0,0,0,0.2);
            padding: 20px;
            overflow-y: auto;
            display: none;
            z-index: 2000;
        }

        #cartPanel h2 {
            margin-bottom: 20px;
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qty button {
            padding: 5px 10px;
            margin: 0 3px;
            cursor: pointer;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: #ff9900;
            color: white;
            border: none;
            margin-top: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .close-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
                @media(max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
            }

            #cartPanel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">SnackKart</div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search South Indian snacks...">
        </div>

        <div class="cart-btn" onclick="toggleCart()">
            Cart (<span id="cartCount">0</span>)
        </div>
    </div>

    <div class="hero">
        <h1>South Indian Snacks Marketplace</h1>
        <p>Order your favorite snacks instantly</p>
    </div>

    <div class="products" id="products"></div>

    <div id="cartPanel">
        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <h3>Total: ₹<span id="totalPrice">0</span></h3>

        <button class="checkout-btn" onclick="checkout()">Checkout</button>
        <button class="close-btn" onclick="toggleCart()">Close</button>
    </div>

    <script>
        const products = [
            {
                name: "Masala Dosa",
                price: 80,
                image: "https://images.unsplash.com/photo-1630383249896-424e482df921?w=800"
            },
            {
                name: "Medu Vada",
                price: 50,
                image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=800"
            },
            {
                name: "Punugulu",
                price: 60,
                image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=800"
            },
            {
                name: "Idli",
                price: 40,
                image: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=800"
            },
            {
                name: "Mysore Bonda",
                price: 55,
                image: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800"
            },
            {
                name: "Mirchi Bajji",
                price: 45,
                image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800"
            }
        ];

        let cart = JSON.parse(localStorage.getItem("snackCart")) || [];

        function renderProducts(productList = products) {
            const productContainer = document.getElementById("products");

            productContainer.innerHTML = productList.map((product, index) => `
                <div class="card">
                    <img src="${product.image}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <div class="price">₹${product.price}</div>
                    <button onclick="addToCart(${index})">Add to Cart</button>
                </div>
            `).join("");
        }
                function addToCart(index) {
            const selectedProduct = products[index];

            const existingItem = cart.find(item => item.name === selectedProduct.name);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    ...selectedProduct,
                    quantity: 1
                });
            }

            saveCart();
        }

        function saveCart() {
            localStorage.setItem("snackCart", JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            document.getElementById("cartCount").innerText =
                cart.reduce((sum, item) => sum + item.quantity, 0);

            const cartItemsContainer = document.getElementById("cartItems");

            cartItemsContainer.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        ₹${item.price}
                    </div>

                    <div class="qty">
                        <button onclick="decreaseQty(${index})">-</button>
                        ${item.quantity}
                        <button onclick="increaseQty(${index})">+</button>
                        <button onclick="removeItem(${index})">X</button>
                    </div>
                </div>
            `).join("");

            const total = cart.reduce(
                (sum, item) => sum + (item.price * item.quantity),
                0
            );

            document.getElementById("totalPrice").innerText = total;
        }

        function increaseQty(index) {
            cart[index].quantity++;
            saveCart();
        }

        function decreaseQty(index) {
            cart[index].quantity--;

            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            saveCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
        }

        function toggleCart() {
            const cartPanel = document.getElementById("cartPanel");

            if (cartPanel.style.display === "block") {
                cartPanel.style.display = "none";
            } else {
                cartPanel.style.display = "block";
            }
        }
                function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            alert("Order placed successfully! Thank you for shopping with SnackKart.");

            cart = [];
            saveCart();
            toggleCart();
        }

        document.getElementById("searchInput").addEventListener("input", function () {
            const query = this.value.toLowerCase();

            const filteredProducts = products.filter(product =>
                product.name.toLowerCase().includes(query)
            );

            renderProducts(filteredProducts);
        });

        renderProducts();
        renderCart();

    </script>

</body>
</html>
